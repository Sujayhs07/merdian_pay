<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="meridian-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
    <radialGradient id="meridian-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ec886" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2ec886" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- High-contrast brand squircle for light and dark browser tab bars -->
  <rect width="32" height="32" rx="8" fill="url(#meridian-bg)" />
  <rect width="32" height="32" rx="8" fill="none" stroke="#2ec886" stroke-opacity="0.25" stroke-width="1" />

  <!-- Subtle ambient pulse -->
  <circle cx="16" cy="16" r="11" fill="url(#meridian-glow)" />

  <!-- Meridian Globe Geometry -->
  <!-- Outer latitude ring -->
  <circle cx="16" cy="16" r="10" stroke="#f0f2f5" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

  <!-- Active signature meridian curve -->
  <path
    d="M 16 6 C 10.48 6 6 10.48 6 16 C 6 21.52 10.48 26 16 26"
    stroke="#2ec886"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Longitudinal ellipse -->
  <ellipse cx="16" cy="16" rx="4.5" ry="10" stroke="#f0f2f5" stroke-width="1.4" stroke-opacity="0.55" fill="none" />

  <!-- Equator line -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#f0f2f5" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Settlement nexus core -->
  <circle cx="16" cy="16" r="3.2" fill="#2ec886" fill-opacity="0.35" />
  <circle cx="16" cy="16" r="2.2" fill="#2ec886" />
</svg>
